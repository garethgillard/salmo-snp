# Development environment: conda-forge only (Anaconda's defaults channel needs a paid licence at larger organisations).
#   conda env create -f environment.yml && conda activate salmo-snp
# Python 3.8 until the portal's Dockerfile sets the version (AGENTS.md); the packages pin what the server runs.
name: salmo-snp
channels: [conda-forge]
dependencies:
  - python=3.8
  - pip
  - pip:
      - duckdb==1.2.2
      - django>=4.2,<5
      - pyyaml
      - pytest
      - -e ./snpscore
      - -e ./snpdata
      - -e ./snpportal
