# Development environment: conda-forge only (Anaconda's defaults channel needs a paid licence at larger organisations).
#   conda env create -f environment.yml && conda activate salmo-snp
# Python as CI's tests job and the NREC demo (3.12); the three folders editable, with the newest versions their
# pyproject.toml files allow (Django 5.2 LTS, DuckDB 1.5, PyYAML 6).
name: salmo-snp
channels: [conda-forge]
dependencies:
  - python=3.12
  - pip
  - pip:
      - pytest
      - -e ./snpscore
      - -e ./snpdata
      - -e ./snpportal
