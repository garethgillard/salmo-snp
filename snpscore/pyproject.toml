[project]
name = "snpscore"
version = "0.1.0"
description = "Annotate and score Atlantic salmon SNPs with AQUA-FAANG functional maps"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"  # LICENSE in the salmo-snp repository
dependencies = ["duckdb>=1.5,<2", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
snpscore = "snpscore.cli:main"

[tool.setuptools.package-data]
snpscore = ["weights.yaml"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "live: needs salmobase.org (run with SNPSCORE_LIVE=1)",
    "dev: needs the genome-wide release/dev (run with SNPSCORE_DEV=1)",
]
