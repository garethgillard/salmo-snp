[project]
name = "snpscore"
version = "0.1.0"
description = "Annotate and score Atlantic salmon SNPs with AQUA-FAANG functional maps"
requires-python = ">=3.8"
dependencies = ["duckdb>=1.2", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
snpscore = "snpscore.cli:main"

[tool.setuptools.package-data]
snpscore = ["weights.yaml"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "live: needs salmobase.org (run with SNPSCORE_LIVE=1)",
    "dev: needs the genome-wide release/dev (run with SNPSCORE_DEV=1)",
]
