# Tier rules. PROVISIONAL: chosen by Claude so the prototype works; G decides the real ones (see AGENTS.md at the repository root).
# Ships with snpscore (snpscore.WEIGHTS), not in the release; `snpscore annotate --trait <preset>` applies it.
# Each SNP gets tier_score = sum of the weights of the evidence it has, then a tier from the cut-offs.
# Layers marked synthetic: true in the release manifest never count.

# The blocks below that G still has to confirm; build lists them in the release manifest.
provisional: [active_states, weak_states, weights, tiers, presets, assay, design, finemap, priors]

active_states: [Active_TSS, Active_enhancer]
# Counted as weak evidence. Not counted at all: Repressed_polycomb, Quiescent, ZNF_genes_and_repeats, Unknown_1.
weak_states: [Primed_enhancer, Poised_enhancer_1, Poised_enhancer_2, Bivalent, Flanking_upstream, Flanking_downstream,
              Accessible_chromatin]

weights:  # whole numbers (tier_score is an integer)
  active: 3            # active state in at least one condition of the preset
  active_elsewhere: 1  # active only in conditions outside the preset
  weak: 1              # weak state in a preset condition, and not active there
  coding: 3            # CDS change to the protein (missense, stop gained or lost, start lost) or of unknown effect
  synonymous: 3        # PROVISIONAL: synonymous CDS change (or stop retained); as coding until G decides if it scores lower
  splice: 3            # splice region
  utr: 1               # 5' or 3' UTR
  constrained: 2       # GERP constrained element (65 fish)
  regbuild: 1          # Ensembl regulatory feature with no AQUA-FAANG peak (68-86% of them overlap a peak)
  molqtl: 0            # nf-RASQUAL caQTL/eQTL lead SNP (12 fish, lead SNPs only): shown in tier_terms, not scored
  motif: 1             # G (2026-10-19): inside a robust ATAC peak, one allele matches a JASPAR 2024 motif at p < 1e-5 and
                       # the other doesn't, with at least 4 bits between them (layers.yaml `motif`; about 15% of in-peak SNPs)

# Per-variant score layers (layers.yaml format variant_scores, ROADMAP I15: DeepFARM, a CADD-like score): a SNP counts
# when its percentile among the scored variants is at least the value here, with the weight of the same name under
# `weights:`. Both are G's to set; until then a score layer is shown but never counted. e.g. deepfarm: 0.9
variant_scores: {}

# Minimum tier_score for tiers 1, 2 and 3; anything lower is tier 4.
# e.g. tier 1 = active + constrained, or CDS + constrained; tier 2 = active, or CDS; tier 3 = any weaker evidence.
tiers: [5, 3, 1]

# Trait presets -> chromatin conditions. Each entry is a prefix of condition names; [] = all 21 conditions.
presets:
  all: []
  maturation: [Brain, Gonad]
  growth_and_fillet: [Muscle, Liver]
  disease_resistance: [Liver]
  development: [LateBlastulation, MidGastrulation, EarlySomitogenesis, MidSomitogenesis, LateSomitogenesis]
  brain: [Brain]
  gonad: [Gonad]
  liver: [Liver]
  muscle: [Muscle]

# Assay designability QC (annotate, with the genome): pass / warn / fail per SNP. PROVISIONAL: chosen by Claude so the
# prototype works; to confirm with the genotyping lab or vendor. fail = a ref_check below or any N in the 71-mer.
assay:
  flank: 35                 # bases either side of the SNP (Axiom probe length): assay_flank is 35 + [REF/ALT] + 35
  gc: [0.30, 0.70]          # warn when the flanks' GC share is outside this range
  max_repeat: 0.9           # warn above this soft-masked (repeat) share of the flanks. About 60% of the salmon genome
                            # is soft-masked and flank shares are mostly 0 or 1 (public_50k: 53% fully masked), so
                            # any cut-off warns on about half of all SNPs; 0.9 keeps the warning for flanks that are
                            # nearly all repeat (paralogue risk: RESEARCH.md section 5)
  max_homopolymer: 6        # warn when a flank has a longer single-base run
  max_flank_variants: 0     # warn when both flanks have more public variants (shown as IUPAC codes): Axiom needs
                            # one clean 35-nt side (flank_variants_per_side: false counts both sides together)
  warn_flags: [lore, blacklist, strand_ambiguous]  # warn when these annotate columns are true
  fail_ref_check: [mismatch, not_snp]              # fail on these ref_check values
  max_paralog_identity: null  # Probe uniqueness (I10, the Design panel's check): flag SNPs whose cleaner flank matches
                              # their Ss4R duplicate region above this identity (e.g. 0.97). G's to set; null: shown, never flagged

# Panel designer defaults (the portal's Design panel; python -m snpportal.lib.cli panel) and chip comparison. PROVISIONAL: chosen by Claude
# so the prototype works; G to confirm.
design:
  n_target: 384
  backbone_fraction: 0.5    # share of the panel spread over the genome: the best SNP per genome-length bin
  min_spacing: 20000        # bp between any two selected SNPs
  min_maf: 0.05             # your maf/af column, else the public MAF; SNPs with unknown MAF pass
  max_per_gene: 2           # nearest gene (gene_id)
  max_per_element: 1        # AQUA-FAANG peak (chromatin_id)
  require_assay_pass: false # true: assay 'pass' only; false: drop assay 'fail' only
  exclude_flags: [blacklist]  # drop SNPs where these columns are true (e.g. lore, strand_ambiguous, near_chip)
  score: {tier: 1.0, assay: 0.3, maf: 0.3}  # design_score: tier_score / max + assay (pass 1, warn 0.5) + MAF / 0.5
  chip_window: 10000        # novel_functional = tier 1-2 with no chip SNP within this many bp
  chip_gap: 1000000         # chip gaps listed when longer than this (bp)
  upgrade_min_call_rate: 0.95  # Upgrade a chip (I11): a marker is dropped below this call rate in your population
  upgrade_min_hwe_p: 1.0e-6    # ... or below this HWE p (exact test); both editable on the Design panel
  # Purposes (ROADMAP I8): each sets the designer's defaults for its parameters (any of the keys above); the Panel tab's
  # Purpose links and `python -m snpportal.lib.cli panel --purpose`. Every number is PROVISIONAL, for G to set.
  presets:
    genomic_selection:
      label: Genomic selection
      help: Even coverage of the genome for genomic prediction, mostly backbone, with a MAF floor
      n_target: 5000
      backbone_fraction: 0.9
      min_spacing: 100000
      min_maf: 0.05
    parentage:
      label: Parentage and traceability
      help: A few hundred unlinked, common SNPs that pass the assay check
      n_target: 200
      backbone_fraction: 1.0
      min_spacing: 2000000
      min_maf: 0.3
      max_per_gene: 1
      require_assay_pass: true
    trait:
      label: Trait panel
      help: The best-scoring SNPs of the Table selection (filter it to the loci first, e.g. Known locus), close together allowed
      n_target: 96
      backbone_fraction: 0.0
      min_spacing: 1000
      min_maf: 0.01
      max_per_gene: 4
    selection_and_traits:  # a mix (I8): each purpose designs its share in turn, with its own numbers above
      label: Genomic selection + trait loci
      help: Mostly even coverage for genomic prediction, plus the best SNPs of the Table selection
      n_target: 5000
      mix: {genomic_selection: 0.9, trait: 0.1}
  target_sizes: [96, 192, 384, 1536, 5000, 50000]  # quick choices for Markers (KASP plates, Axiom formats: to confirm with the vendor)

# GWAS loci and fine-mapping (snpscore.gwas, the portal's Association page). PROVISIONAL: chosen by Claude so the
# prototype works; G to confirm. Users can change them per view; the ROADMAP's 'Open questions for G' lists them.
finemap:
  prior_sd: 0.2             # W = prior_sd^2 = 0.04: prior variance of the effect on the standardised scale (Wakefield ABF)
  functional_lambda: 0.5    # functional prior pi_i ~ exp(lambda * tier_score_i) (up to about 90x between SNPs)
  coverage: 0.95            # credible set: SNPs in descending PIP until their PIPs sum to this
  significant: 5.0e-8       # genome-wide significance (a convention from human GWAS)
  suggestive: 1.0e-5        # loci down to this p are listed as suggestive
  window: 1000000           # bp either side of a lead SNP (greedy distance clumping; farmed lines have long-range LD)
  near_lead: 2              # 'near the lead': within this many log10 units of the lead's p
  trait_sd: 1.0             # betas are divided by this (1 = a standardised trait); replaced by the SD that se, N and af
                            # imply when the statistics have them (gwas.settings)

# Genomic-prediction priors (the portal's priors export). PROVISIONAL: chosen by Claude so the prototype works; G to confirm.
priors:
  order: [tier1_2, active, coding, constrained, regulatory]  # BayesRC class / LDAK partition = the first category a SNP is in; 'none' is always last
