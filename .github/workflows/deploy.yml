name: deploy
# The NREC demo is updated only when G says so (G, 2026-11-06): a batch of merged, tested changes at a time, never on
# every merge. Actions > deploy > Run workflow on main, or a session asked to in the chat (AGENTS.md "Deploying the
# NREC demo"). When the VM says its public pool is stale (a weights.yaml or snpscore change), the pool is built here
# and sent (the VM's 2 GB RAM can't build it). A new data release still goes up with deploy/nrec.sh.
on:
  workflow_dispatch:

jobs:
  tests:  # the checks every pull request runs, on the commit going live
    uses: ./.github/workflows/tests.yml

  deploy:
    # snpportal/deploy/update.sh on the VM (snpportal/README.md "Deploying the demo"); the key in NREC_DEPLOY_KEY can
    # run nothing else there. Main only; off until the NREC_HOST variable is set.
    needs: tests
    if: github.ref == 'refs/heads/main' && vars.NREC_HOST != ''
    runs-on: ubuntu-latest
    concurrency: nrec
    timeout-minutes: 15  # a deploy takes ~20 s, a pool ~3 min; a stuck one shouldn't hold the nrec group for GitHub's 6 h
    env:
      HOST: ${{ vars.NREC_HOST }}
    steps:
      - name: Update the demo
        id: update
        shell: bash  # -o pipefail, so a failed ssh fails the step through tee
        env:
          KEY: ${{ secrets.NREC_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.NREC_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes ubuntu@"$HOST" "$GITHUB_SHA" 2>&1 | tee update.log
          if grep -q "public pool is stale" update.log; then echo "stale=true" >> "$GITHUB_OUTPUT"; fi
      # The public pool for the code just deployed: salmo-snp download builds it as in every local install (I3)
      - uses: actions/checkout@v7
        if: steps.update.outputs.stale == 'true'
      - uses: actions/setup-python@v7
        if: steps.update.outputs.stale == 'true'
        with:
          python-version: "3.12"
      - name: Build the public pool and send it
        if: steps.update.outputs.stale == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q ./snpscore ./snpportal
          bash tools/get_data.sh --no-genome
          version=$(sed -n 's/^RELEASE = "\([^"]*\)".*/\1/p' snpportal/snpportal/serve.py)
          release=~/.local/share/salmo-snp/releases/$version
          python -c 'import sys; from snpscore.pool import stale; sys.exit(stale(sys.argv[1]))' "$release"
          tar -C "$release/pool" -czf - pool.parquet background.json |
            ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes ubuntu@"$HOST" pool
