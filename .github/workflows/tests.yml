name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # deploy.yml runs these first (merging to main never deploys: G, 2026-11-06)

jobs:
  tests:
    runs-on: ubuntu-24.04  # as the NREC demo (Ubuntu 24.04, Python 3.12)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: No data files outside the test fixture
        # Breeder data (genotypes, GWAS results, array manifests) must never be committed (AGENTS.md).
        run: |
          bad=$(git ls-files | grep -iE '\.(vcf|vcf\.gz|bcf|bim|bed|fam|ped|map|bgen|gen|parquet|xlsx?)$' \
                | grep -v '^snpdata/tests/fixture/' || true)
          big=$(git ls-files -z | xargs -0 du -k | awk '$1 > 1024 {print $2}')
          if [ -n "$bad$big" ]; then echo "Not allowed outside snpdata/tests/fixture, or over 1 MB:"; echo "$bad $big"; exit 1; fi
      - run: pip install -e "snpscore[test]" -e snpdata -e snpportal  # the newest versions the packages allow, as deploys get
      - name: pyflakes and the four test suites
        run: bash tools/check.sh  # the same command developers and cloud sessions run before pushing

  user-install:
    # A new user's install: the built wheels with the newest dependencies they allow, on the oldest and the newest
    # Python the packages support, then download, annotate and serve (tools/user_install_test.sh).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]  # requires-python's floor (pyproject.toml), and the newest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: bash tools/user_install_test.sh python
