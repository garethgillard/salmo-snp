name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-22.04  # the last runner image with Python 3.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: No data files outside the test fixture
        # Breeder data (genotypes, GWAS results, array manifests) must never be committed (AGENTS.md).
        run: |
          bad=$(git ls-files | grep -iE '\.(vcf|vcf\.gz|bcf|bim|bed|fam|ped|map|bgen|gen|parquet|xlsx?)$' \
                | grep -v '^snpdata/tests/fixture/' || true)
          big=$(git ls-files -z | xargs -0 du -k | awk '$1 > 1024 {print $2}')
          if [ -n "$bad$big" ]; then echo "Not allowed outside snpdata/tests/fixture, or over 1 MB:"; echo "$bad $big"; exit 1; fi
      - run: pip install -e "snpscore[test]" -e snpdata -e snpportal "django>=4.2,<5" "duckdb==1.2.2"
      - name: pyflakes
        run: PYTHONPATH=tools/pyflakes-3.4.0-py2.py3-none-any.whl python -m pyflakes snpscore/src snpdata/src snpportal/snpportal/lib
      - run: cd snpscore && python -m pytest -q
      - run: cd snpdata && python -m pytest -q
      - run: cd snpportal && python -m pytest -q tests
      - run: cd snpportal && SNPPORTAL_WORKERS=0 python manage.py test snpportal

  deploy:
    # After the tests pass on main: update the NREC demo (snpportal/deploy/update.sh; README "Automatic deploys").
    # The key in NREC_DEPLOY_KEY can only run update.sh on the VM. Off until the NREC_HOST variable is set.
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NREC_HOST != ''
    runs-on: ubuntu-latest
    concurrency: nrec
    steps:
      - name: Update the demo
        env:
          KEY: ${{ secrets.NREC_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.NREC_KNOWN_HOSTS }}
          HOST: ${{ vars.NREC_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes ubuntu@"$HOST" "$GITHUB_SHA"
