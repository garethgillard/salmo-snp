name: release
on:
  push:
    tags: ["v*"]

jobs:
  wheels:
    # A vX.Y.Z tag on main: build the snpscore, snpdata and salmo-snp wheels and attach them to a GitHub Release
    # (salmobase's container and licensed users install from there; AGENTS.md plan 6). Set the version in the three
    # pyproject.toml files first.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build -e "snpscore[test]" -e snpdata -e snpportal
      - name: The checks, on the versions this release ships with
        run: bash tools/check.sh
      - name: constraints.txt, those exact versions, for installs that must reproduce a result (pip install -c)
        run: pip freeze --exclude-editable > constraints.txt
      - run: for d in snpscore snpdata snpportal; do python -m build --wheel --outdir dist "$d"; done
      - run: gh release create "$GITHUB_REF_NAME" dist/*.whl constraints.txt --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
