{# Stand-in for salmobase's base.html: same Bootstrap version and the same blocks (head, content, scripts). #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salmobase (dev)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% block head %}{% endblock head %}
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3"><span class="navbar-brand">salmobase · dev</span></nav>
  {% block content %}{% endblock content %}
  {% block scripts %}{% endblock scripts %}
</body>
</html>
